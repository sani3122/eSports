name: Auto Facebook Live Scraper

on:
  schedule:
    - cron: '*/10 * * * *'  # প্রতি ১০ মিনিট পর পর রান হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার অপশন

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python facebook.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Facebook live M3U playlist"
          file_pattern: "live_playlist.m3u"
          
